name: Build Android

on:
  push:
    paths:
      - pubspec.yaml

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Check pubspec version
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare version
        id: check
        run: |
          set -euo pipefail
          version=$(awk '/^version:/ {print $2; exit}' pubspec.yaml)
          before="${{ github.event.before }}"
          old=""
          if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
            if ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
              git fetch --depth=1 origin "$before" || true
            fi
            if git cat-file -e "${before}^{commit}" 2>/dev/null; then
              old=$(git show "${before}:pubspec.yaml" | awk '/^version:/ {print $2; exit}')
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$version" ] && [ "$version" != "$old" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "版本从 ${old:-无} 变为 ${version}，开始打包" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "version 未变化（当前 ${version}），跳过打包" >> "$GITHUB_STEP_SUMMARY"
          fi

  android:
    name: Android APK / AAB
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Gradle wrapper
        working-directory: android
        run: |
          set -euo pipefail
          if [ ! -f gradlew ]; then
            curl -fsSL -o gradlew https://raw.githubusercontent.com/gradle/gradle/v9.5.0/gradlew
            chmod +x gradlew
          fi
          if [ ! -f gradlew.bat ]; then
            curl -fsSL -o gradlew.bat https://raw.githubusercontent.com/gradle/gradle/v9.5.0/gradlew.bat
          fi
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              https://github.com/gradle/gradle/raw/v9.5.0/gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Limit Gradle memory
        run: |
          sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m/' android/gradle.properties

      - name: Decode release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK and AAB
        run: |
          set -euo pipefail
          flutter build apk --release
          flutter build appbundle --release

      - name: Collect artifacts
        run: |
          set -euo pipefail
          version=$(awk '/^version:/ {print $2}' pubspec.yaml | tr '+' '-')
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/windmark-${version}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/windmark-${version}.aab"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Android 使用正式签名" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Android 未配置密钥，当前为调试签名，只能用于安装测试" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach to GitHub Release
    needs: [version, android]
    if: needs.version.outputs.changed == 'true' && needs.android.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.version }}
          files: dist/*
          fail_on_unmatched_files: true
