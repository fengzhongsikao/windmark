name: Build Android and iOS

on:
  push:
    paths:
      - pubspec.yaml

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Check pubspec version
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare version
        id: check
        run: |
          set -euo pipefail
          version=$(awk '/^version:/ {print $2; exit}' pubspec.yaml)
          before="${{ github.event.before }}"
          old=""
          if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ]; then
            if ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
              git fetch --depth=1 origin "$before" || true
            fi
            if git cat-file -e "${before}^{commit}" 2>/dev/null; then
              old=$(git show "${before}:pubspec.yaml" | awk '/^version:/ {print $2; exit}')
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$version" ] && [ "$version" != "$old" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "版本从 ${old:-无} 变为 ${version}，开始打包" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "version 未变化（当前 ${version}），跳过打包" >> "$GITHUB_STEP_SUMMARY"
          fi

  android:
    name: Android APK / AAB
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Gradle wrapper
        working-directory: android
        run: |
          set -euo pipefail
          if [ ! -f gradlew ]; then
            curl -fsSL -o gradlew https://raw.githubusercontent.com/gradle/gradle/v9.3.1/gradlew
            chmod +x gradlew
          fi
          if [ ! -f gradlew.bat ]; then
            curl -fsSL -o gradlew.bat https://raw.githubusercontent.com/gradle/gradle/v9.3.1/gradlew.bat
          fi
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar \
              https://github.com/gradle/gradle/raw/v9.3.1/gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Limit Gradle memory
        run: |
          sed -i 's/org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m/' android/gradle.properties

      - name: Decode release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK and AAB
        run: |
          set -euo pipefail
          flutter build apk --release
          flutter build appbundle --release

      - name: Collect artifacts
        run: |
          set -euo pipefail
          version=$(awk '/^version:/ {print $2}' pubspec.yaml | tr '+' '-')
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/windmark-${version}.apk"
          cp build/app/outputs/bundle/release/app-release.aab "dist/windmark-${version}.aab"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Android 使用正式签名" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Android 未配置密钥，当前为调试签名，只能用于安装测试" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  ios:
    name: iOS IPA
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: macos-latest
    env:
      IOS_EXPORT_METHOD: ad-hoc
      IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install Apple signing
        if: env.IOS_CERTIFICATE_P12_BASE64 != '' && env.IOS_PROVISIONING_PROFILE_BASE64 != ''
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          printf '%s' "$IOS_CERTIFICATE_P12_BASE64" | tr -d '\n\r ' | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"

          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | tr -d '\n\r ' | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' "$PROFILE_PLIST")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "$PROFILE_PLIST")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F '"' 'NF > 1 { print $2; exit }')
          if [ -z "$IDENTITY" ]; then
            echo "证书里没有可用的代码签名身份"
            exit 1
          fi

          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "CODE_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build signed IPA
        if: env.IOS_CERTIFICATE_P12_BASE64 != '' && env.IOS_PROVISIONING_PROFILE_BASE64 != ''
        run: |
          set -euo pipefail
          version=$(awk '/^version:/ {print $2}' pubspec.yaml | tr '+' '-')
          flutter build ios --release --config-only

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>${IOS_EXPORT_METHOD}</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>${CODE_SIGN_IDENTITY}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.wind.windmark</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            archive \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

          mkdir -p dist
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          cp "$RUNNER_TEMP/ipa/"*.ipa "dist/windmark-${version}.ipa"
          echo "iOS 已签名，导出方式 ${IOS_EXPORT_METHOD}" >> "$GITHUB_STEP_SUMMARY"

      - name: Build unsigned iOS app
        if: env.IOS_CERTIFICATE_P12_BASE64 == '' || env.IOS_PROVISIONING_PROFILE_BASE64 == ''
        run: |
          set -euo pipefail
          version=$(awk '/^version:/ {print $2}' pubspec.yaml | tr '+' '-')
          flutter build ios --release --no-codesign
          mkdir -p dist
          ditto -c -k --keepParent build/ios/iphoneos/Runner.app "dist/windmark-${version}-unsigned.zip"
          echo "iOS 未配置证书，产物未签名，不能直接安装到设备" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing keychain
        if: always() && env.KEYCHAIN != ''
        run: security delete-keychain "$KEYCHAIN" || true

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach to GitHub Release
    needs: [version, android, ios]
    if: needs.version.outputs.changed == 'true' && needs.android.result == 'success' && needs.ios.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: ${{ needs.version.outputs.version }}
          files: dist/*
          fail_on_unmatched_files: true
